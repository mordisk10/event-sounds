# XcodeGen manifest for the Instakai UI app.
#
#   brew install xcodegen && make project
#
# The .xcodeproj is generated, not committed — project files conflict badly and
# this manifest is the readable source of truth.
name: Instakai
options:
  bundleIdPrefix: com.instakai
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

targets:
  Instakai:
    type: application
    platform: iOS
    sources:
      - path: Instakai
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: InstakaiWidget
        embed: true
    info:
      path: Instakai/Info.plist
      properties:
        CFBundleDisplayName: Instakai
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        # Empty dictionary = system launch screen on the default background.
        # Naming a colour here requires a matching asset, and a missing one
        # silently launches black.
        UILaunchScreen: {}
        # Portrait only: the panoramic slider and the mic layout are designed
        # around a single column.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Required for the Live Activity that drives the Dynamic Island.
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        NSMicrophoneUsageDescription: >-
          Instakai sesli komutlarını tanımak için mikrofonu kullanır.
        NSCameraUsageDescription: >-
          Instakai yüz hareketlerini tanımak için ön kamerayı kullanır.
          Görüntü cihazdan çıkmaz ve kaydedilmez.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.instakai.app
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Sets the system-level tint (share sheets, alerts) to match
        # Theme.Palette.accent, which SwiftUI's own .tint cannot reach.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  InstakaiWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      # The Live Activity attributes are shared with the app rather than
      # duplicated, so the two can never drift apart.
      - path: Instakai/Island/LiveActivityAttributes.swift
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Instakai
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.instakai.app.widget
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
