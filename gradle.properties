# Plugin coordinates ------------------------------------------------------
pluginGroup = com.mordisk.eventsounds
pluginVersion = 1.1.0

# Lowest IDE build the plugin supports (232 = 2023.2).
pluginSinceBuild = 232

# IntelliJ Platform the plugin is compiled against.
platformVersion = 2023.2.6

# Marketplace release channel used by `publishPlugin`.
# "default" is the public stable channel; "eap" ships to early-access subscribers only.
pluginChannel = default

# Build performance -------------------------------------------------------
org.gradle.caching = true
org.gradle.parallel = true
org.gradle.jvmargs = -Xmx2048m -XX:MaxMetaspaceSize=768m
kotlin.stdlib.default.dependency = false
