# XcodeGen manifest.
#
# The .xcodeproj is generated rather than committed: a project file is a merge
# conflict magnet, and this manifest is the readable source of truth.
#
#   brew install xcodegen && make project
name: Instakai
options:
  bundleIdPrefix: com.instakai
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  InstakaiCore:
    path: .

targets:
  Instakai:
    type: application
    platform: iOS
    sources:
      - path: App/Instakai
        excludes:
          - "**/.DS_Store"
    resources:
      - App/Instakai/Resources
    dependencies:
      - package: InstakaiCore
        product: InstakaiCore
    info:
      path: App/Instakai/Info.plist
      properties:
        CFBundleDisplayName: Instakai
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        # Face tracking needs the camera; the string is shown in the system prompt.
        NSCameraUsageDescription: >-
          Instakai yüz ve dil hareketlerinizi tanımak için ön kamerayı kullanır.
          Görüntü cihazdan çıkmaz ve kaydedilmez.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - arm64
          # Restricts installs to devices that actually have face tracking.
          - iphone-ipad-minimum-performance-a12
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.instakai.app
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_STRICT_CONCURRENCY: minimal
